# Fill every REPLACE_* value in a task-specific copy.
# Candidate snapshot: derived-era5-single-levels-daily-statistics_*.yaml,
# 2026-10-27. Examples only, not the complete CDS catalogue.
dataset: derived-era5-single-levels-daily-statistics
product_type: reanalysis
# daily_mean candidates:
# 10m_u_component_of_wind, 10m_v_component_of_wind, 2m_dewpoint_temperature,
# 2m_temperature, mean_sea_level_pressure, sea_surface_temperature,
# surface_pressure, 100m_u_component_of_wind, 100m_v_component_of_wind,
# high_cloud_cover, low_cloud_cover, medium_cloud_cover, total_cloud_cover,
# soil_temperature_level_1, soil_temperature_level_2, soil_temperature_level_3,
# soil_temperature_level_4, volumetric_soil_water_layer_1,
# volumetric_soil_water_layer_2, volumetric_soil_water_layer_3,
# volumetric_soil_water_layer_4, sea_ice_cover,
# total_column_water, total_column_water_vapour.
# daily_sum candidates:
# total_precipitation, surface_net_solar_radiation,
# surface_solar_radiation_downwards, top_net_thermal_radiation,
# total_sky_direct_solar_radiation_at_surface.
# daily_max candidate: maximum_2m_temperature_since_previous_post_processing.
# daily_min candidate: minimum_2m_temperature_since_previous_post_processing.
# Those extrema are not equivalent to extrema of hourly 2m_temperature.
# Replace the key with daily_mean, daily_sum, daily_max or daily_min.
# Add only requested groups, each containing exactly variable.
statistics:
  REPLACE_WITH_DAILY_STATISTIC:
    variable:
      - REPLACE_WITH_CDS_VARIABLE
# Input sampling frequency, NOT output frequency: 1_hourly, 3_hourly, 6_hourly.
frequency: REPLACE_WITH_FREQUENCY
# Observed: utc+00:00. Choose the requested daily boundary explicitly.
time_zone: REPLACE_WITH_TIME_ZONE
# [north, west, south, east]; null only for explicit global scope.
area: [REPLACE_NORTH, REPLACE_WEST, REPLACE_SOUTH, REPLACE_EAST]
# No time, data_format, download_format or pressure_level.
# Dates belong in the Batch; daily output is NetCDF ZIP.
