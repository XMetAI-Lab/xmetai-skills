# Fill every REPLACE_* value in a task-specific copy.
# Candidate snapshot: reanalysis-era5-pressure-levels_pl_h_v1.yaml, 2026-10-27.
# Examples only, not the complete CDS catalogue.
dataset: reanalysis-era5-pressure-levels
product_type: [reanalysis]
# Candidates: geopotential, temperature, u_component_of_wind,
# v_component_of_wind, vertical_velocity, specific_humidity.
variable:
  - REPLACE_WITH_CDS_VARIABLE
# Unique quoted HH:00 strings; observed: "00:00", "06:00", "12:00", "18:00".
time:
  - REPLACE_WITH_HH_00
# hPa, as quoted strings. Observed:
# "1000", "925", "850", "700", "600", "500", "400",
# "300", "250", "200", "150", "100", "50", "10".
pressure_level:
  - REPLACE_WITH_PRESSURE_HPA
# [north, west, south, east]; null only when global scope is explicitly requested.
area: [REPLACE_NORTH, REPLACE_WEST, REPLACE_SOUTH, REPLACE_EAST]
# Source profile uses netcdf + unarchived; do not assume all format combinations.
data_format: REPLACE_WITH_DATA_FORMAT
download_format: REPLACE_WITH_DOWNLOAD_FORMAT
# Dates and output directory belong in the Batch.
