# Fill every REPLACE_* value in a task-specific copy.
# Candidate snapshot: reanalysis-era5-land_soil_h6_v1.yaml, 2026-10-27.
# Examples only, not the complete ERA5-Land catalogue.
dataset: reanalysis-era5-land
# This endpoint does not require product_type.
# Candidates: volumetric_soil_water_layer_1, volumetric_soil_water_layer_2,
# soil_temperature_level_1, soil_temperature_level_2.
variable:
  - REPLACE_WITH_CDS_VARIABLE
# Unique quoted HH:00 strings; observed: "00:00", "06:00", "12:00", "18:00".
time:
  - REPLACE_WITH_HH_00
area: [REPLACE_NORTH, REPLACE_WEST, REPLACE_SOUTH, REPLACE_EAST]
# area order: north, west, south, east; null requires explicit global scope.
# Source profile uses netcdf + zip.
data_format: REPLACE_WITH_DATA_FORMAT
download_format: REPLACE_WITH_DOWNLOAD_FORMAT
# Soil layers are part of variable names, not pressure_level.
# Dates and output directory belong in the Batch.
